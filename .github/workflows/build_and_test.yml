name: Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

# A new push to the same PR cancels whatever run its previous push started --
# no point letting a stale commit finish building. Grouped by PR number so
# only that PR's own runs cancel each other (github.event.pull_request.number
# is unset for push/workflow_dispatch, where the group falls back to the ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PRs are what this validates; the push that lands the merge commit on
    # main is the same tree a passing PR run already checked, so don't build
    # it twice. workflow_dispatch stays available for an on-demand run.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@master

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        working-directory: build
        run: ctest --build-config Release --output-on-failure --verbose

      - name: Install Valgrind (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Reconfigure CMake with Valgrind (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cmake -B build

      - name: Verify Valgrind Configuration (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: build
        run: |
          if ! grep -q "MemoryCheckCommand:.*valgrind" DartConfiguration.tcl; then
            echo "ERROR: Valgrind was not found by CMake"
            exit 1
          fi
          echo "Valgrind successfully configured"

      - name: Run Tests with Valgrind (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: build
        run: |
          ctest --build-config Release --output-on-failure --verbose -T memcheck

      - name: Show Valgrind log (Linux only)
        # Same reasoning as the equivalent step in build-rust: ctest only prints
        # a one-line defect count, not the actual Valgrind report.
        if: always() && matrix.os == 'ubuntu-latest'
        working-directory: build
        run: cat Testing/Temporary/MemoryChecker.*.log

  build-rust:
    name: Build and Test (Rust backend)
    # Same reasoning as build: only PRs (and on-demand runs) need this.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@master

      - name: Configure CMake (Rust backend)
        # CMAKE_BUILD_TYPE, not just --config: on Linux this is a single-config
        # generator, where --config is ignored and the build type has to be set
        # here for the release profile to be the one that gets tested.
        run: cmake -B build -DNOTIFLY_BACKEND=rust -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        working-directory: build
        run: ctest --build-config Release --output-on-failure --verbose

      - name: Install Valgrind (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Reconfigure CMake with Valgrind (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cmake -B build -DNOTIFLY_BACKEND=rust -DCMAKE_BUILD_TYPE=Release

      - name: Verify Valgrind Configuration (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: build
        run: |
          if ! grep -q "MemoryCheckCommand:.*valgrind" DartConfiguration.tcl; then
            echo "ERROR: Valgrind was not found by CMake"
            exit 1
          fi
          echo "Valgrind successfully configured"

      - name: Run Tests with Valgrind (Linux only)
        # Exercises the unsafe FFI glue in rust/src/lib.rs (raw pointer capture
        # in notifly_exchange::on(), the observer/task bookkeeping) via the same
        # C API test suite the cpp backend runs under Valgrind, just linked
        # against notifly_c.dll/.so built from the Rust crate instead.
        if: matrix.os == 'ubuntu-latest'
        working-directory: build
        run: |
          ctest --build-config Release --output-on-failure --verbose -T memcheck

      - name: Show Valgrind log (Linux only)
        # ctest only prints a one-line defect count, not the actual Valgrind
        # report; this dumps it so a failure here is diagnosable from the run
        # log instead of needing a local Linux box to reproduce it.
        if: always() && matrix.os == 'ubuntu-latest'
        working-directory: build
        run: cat Testing/Temporary/MemoryChecker.*.log

  tag-release:
    name: Tag release
    # Only after a real merge to main -- never on a pull_request event. No
    # needs: [build, build-rust] here on purpose -- those jobs don't run for
    # this event (see their own `if:`), and a job skipped by its own condition
    # would make anything that needs() it skip too, taking this down with it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        # The single source of truth is project(notifly VERSION x.y.z) in
        # CMakeLists.txt -- everything else (notifly_version.h, rust/Cargo.toml,
        # the notifly_c SOVERSION) is generated or read from it, so read it from
        # there rather than from a generated file that may not have been
        # regenerated and committed.
        run: |
          version=$(grep -oP '(?<=^project\(notifly VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists -- nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        # Creates the tag and the GitHub Release together, targeting this push's
        # commit -- matches every release already on the repo (v2..v3.7), which
        # are Releases, not bare tags.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"

